<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sez Print · Web Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <b class="brand">Sez Print · Web Lab</b>
    <button id="newBtn">New</button>
    <button id="openBtn" class="primary">Open .sezlabel…</button>
    <button id="sampleBtn" title="Load the sample made from the test fixtures">Sample</button>
    <span class="sep"></span>
    <button id="exportBtn" class="primary">Export .sezlabel</button>
    <label class="inline" title="Ship your own SVG/picture clipart inside the file"><input type="checkbox" id="incClipart" checked> own clipart</label>
    <button id="svgBtn">SVG</button>
    <button id="pngBtn">PNG</button>
    <select id="pngDpi" title="PNG resolution"><option>203</option><option>300</option><option>152</option></select><small>dpi</small>
    <span class="sep"></span>
    <button id="undoBtn" disabled>Undo</button>
    <button id="redoBtn" disabled>Redo</button>
    <span class="grow"></span>
    <small class="muted">Preview approximates the phone renderer. Not a print proof.</small>
  </header>

  <main>
    <aside id="left">
      <h3>Add element</h3>
      <div id="tools"></div>
      <h3>View &amp; scale</h3>
      <div class="view">
        <label class="f"><span>Zoom <small id="zoomLabel"></small></span><input id="zoom" type="range" min="1" max="60" step="0.25" value="8"></label>
        <div class="btns"><button id="fitBtn">Fit</button><button id="realBtn" title="Real size, using the screen ppi below">1 : 1</button></div>
        <label class="f"><span>Screen ppi<small>for 1 : 1</small></span><input id="ppi" type="number" value="96" min="40" max="600"></label>
        <label class="f"><span>Units</span><select id="unit"><option>mm</option><option>cm</option><option>in</option></select></label>
        <label class="f"><span>Grid</span><input id="grid" type="checkbox"></label>
        <label class="f"><span>Grid (mm)</span><input id="gridMm" type="number" value="5" min="0.5" step="0.5"></label>
        <label class="f"><span>Snap (mm)<small>0 = off</small></span><input id="snapMm" type="number" value="0.5" min="0" step="0.1"></label>
      </div>
    </aside>

    <section id="canvasScroll"><div id="stageHost"></div></section>

    <aside id="right">
      <h3>Label</h3>
      <div id="labelPanel"></div>
      <h3>Element</h3>
      <div id="elPanel"></div>
      <h3>Layers <small class="muted">top = drawn last</small></h3>
      <ul id="layers"></ul>
    </aside>
  </main>

  <footer><span id="sizeLabel"></span><span id="cursorLabel">—</span><span class="muted">Drag to move · corner handle to resize · arrows nudge 0.1 mm (Shift = 1 mm) · drop a .sezlabel anywhere to open</span></footer>

  <dialog id="report"><h2 id="reportTitle"></h2><div id="reportBody"></div><div class="btns"><button id="closeReport" class="primary">OK</button></div></dialog>
  <dialog id="sigDialog"><h2>Draw a signature</h2><canvas id="sigCanvas" width="400" height="200"></canvas><div class="btns"><button id="sigClear">Clear</button><button id="sigCancel">Cancel</button><button id="sigDone" class="primary">Add</button></div></dialog>
  <script src="app.js"></script>
</body>
</html>
