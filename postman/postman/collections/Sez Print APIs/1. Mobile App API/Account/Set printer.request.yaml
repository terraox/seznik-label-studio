$kind: http-request
description: "printerId: one of the app printer ids (Tejas, Rudra, Josh — see lib/printers.ts)."
url: "{{adminUrl}}/api/app/printer"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: x-app-version
    value: "{{appVersion}}"
    description: Shown on the desk as the user's app version.
  - key: x-app-build
    value: "{{appBuild}}"
    description: Native build number. Below minAppBuild (or missing while legacyCutoff is on) → 426 UPGRADE_REQUIRED.
  - key: x-app-platform
    value: "{{appPlatform}}"
    description: android | ios | web
  - key: x-app-device
    value: "{{appDevice}}"
    description: e.g. "Samsung SM-A546E" (ASCII, ≤60 chars).
body:
  type: json
  content: |-
    {
      "printerId": "tejas"
    }
order: 2000
