$kind: http-request
description: No sign-in. Admin contact for the blocked screen, minAppBuild, legacyCutoff. Cached 60 s.
url: "{{adminUrl}}/api/app/config"
method: GET
headers:
  - key: x-app-version
    value: "{{appVersion}}"
    description: Shown on the desk as the user's app version.
  - key: x-app-build
    value: "{{appBuild}}"
    description: Native build number. Below minAppBuild (or missing while legacyCutoff is on) → 426 UPGRADE_REQUIRED.
  - key: x-app-platform
    value: "{{appPlatform}}"
    description: android | ios | web
  - key: x-app-device
    value: "{{appDevice}}"
    description: e.g. "Samsung SM-A546E" (ASCII, ≤60 chars).
auth:
  type: noauth
order: 3000
