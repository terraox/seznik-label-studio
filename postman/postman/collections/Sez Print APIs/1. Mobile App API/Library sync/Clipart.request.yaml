$kind: http-request
url: "{{adminUrl}}/api/v1/clipart"
method: GET
headers:
  - key: x-app-version
    value: "{{appVersion}}"
    description: Shown on the desk as the user's app version.
  - key: x-app-build
    value: "{{appBuild}}"
    description: Native build number. Below minAppBuild (or missing while legacyCutoff is on) → 426 UPGRADE_REQUIRED.
  - key: x-app-platform
    value: "{{appPlatform}}"
    description: android | ios | web
  - key: x-app-device
    value: "{{appDevice}}"
    description: e.g. "Samsung SM-A546E" (ASCII, ≤60 chars).
queryParams:
  - key: since
    value: 2026-01-01T00:00:00.000Z
    disabled: true
    description: Only items updated after this time
order: 2000
