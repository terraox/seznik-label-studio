$kind: http-request
description: Uses an otpProof for purpose "login" instead of a password. Saves appToken.
url: "{{adminUrl}}/api/app/login"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: x-app-version
    value: "{{appVersion}}"
    description: Shown on the desk as the user's app version.
  - key: x-app-build
    value: "{{appBuild}}"
    description: Native build number. Below minAppBuild (or missing while legacyCutoff is on) → 426 UPGRADE_REQUIRED.
  - key: x-app-platform
    value: "{{appPlatform}}"
    description: android | ios | web
  - key: x-app-device
    value: "{{appDevice}}"
    description: e.g. "Samsung SM-A546E" (ASCII, ≤60 chars).
body:
  type: json
  content: |-
    {
      "mobile": "{{mobile}}",
      "otpProof": "{{otpProof}}",
      "platform": "{{appPlatform}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const v = body.token;
      if (v) { pm.collectionVariables.set('appToken', v); console.log('appToken =', v); }
    language: text/javascript
order: 6000
