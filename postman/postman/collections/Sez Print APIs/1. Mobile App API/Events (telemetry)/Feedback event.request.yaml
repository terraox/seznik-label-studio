$kind: http-request
description: |-
  rating 1–5, category: suggestion | bug | other, message ≤1000 chars. 5 feedbacks/day/user.

  Batch: `{ sentAt, events: [...] }`, up to 50 events, ≤256 KB. Rate limit 120 batches/min/user.
  Returns 200 with a result per event (`accepted` / `duplicate` / `rejected` + reason). A batch where every event is rejected for PRINTER_REQUIRED is a 400.
url: "{{adminUrl}}/api/v1/events"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: x-app-version
    value: "{{appVersion}}"
    description: Shown on the desk as the user's app version.
  - key: x-app-build
    value: "{{appBuild}}"
    description: Native build number. Below minAppBuild (or missing while legacyCutoff is on) → 426 UPGRADE_REQUIRED.
  - key: x-app-platform
    value: "{{appPlatform}}"
    description: android | ios | web
  - key: x-app-device
    value: "{{appDevice}}"
    description: e.g. "Samsung SM-A546E" (ASCII, ≤60 chars).
body:
  type: json
  content: |-
    {
      "sentAt": "{{$isoTimestamp}}",
      "events": [
        {
          "eventId": "{{$guid}}",
          "occurredAt": "{{$isoTimestamp}}",
          "type": "feedback",
          "rating": 5,
          "category": "suggestion",
          "message": "Loving the app!",
          "platform": "{{appPlatform}}"
        }
      ]
    }
order: 4000
