$kind: http-request
url: "{{adminUrl}}/api/assets"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Star
    - type: text
      key: kind
      value: clipart
      description: clipart (.svg/.png) | sticker (.png/.webp)
    - type: file
      key: file
      src: []
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const v = body.asset && body.asset.id;
      if (v) { pm.collectionVariables.set('assetId', v); console.log('assetId =', v); }
    language: text/javascript
order: 7000
